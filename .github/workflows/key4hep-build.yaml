name: Key4hep build

# Build and test against the Key4hep stack from CVMFS, following
# https://github.com/key4hep/key4hep-actions/blob/main/key4hep-build/action.yml, plus a hit-by-hit
# comparison of the digitiser output with the base branch of pull requests.

on:
  push:
    branches:
    - master
  pull_request:
    # labeled/unlabeled: re-run when the changes-output label is added or removed
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
  schedule:
    - cron: '16 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        build_type: ["release", "nightly"]
        image: ["alma9"]
        include:
          - build_type: nightly
            image: ubuntu24
      fail-fast: false
    # The nightlies change under our feet: report, but do not block
    continue-on-error: ${{ matrix.build_type == 'nightly' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/key4hep/key4hep-images/${{ matrix.image }}-cvmfs
      options: --privileged
    defaults:
      run:
        shell: bash
    env:
      WARNING_FLAGS: "-Wno-error=cpp -Wno-error=deprecated-declarations"
    steps:
      - uses: actions/checkout@v4
        with:
          path: head

      - name: Check out the base branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Mount CVMFS
        run: /mount.sh

      - name: Set up the Key4hep stack
        run: |
          set -e
          if [ "${{ matrix.build_type }}" = "release" ]; then
            source /cvmfs/sw.hsf.org/key4hep/setup.sh
          else
            source /cvmfs/sw-nightlies.hsf.org/key4hep/setup.sh
          fi
          # C++23 with GCC 15 or newer, C++20 otherwise, as in key4hep-build
          GCC_MAJOR=$(g++ -dumpversion | cut -d. -f1)
          if [ "$GCC_MAJOR" -ge 15 ]; then CXX_STANDARD=23; else CXX_STANDARD=20; fi
          echo "Key4hep stack: $KEY4HEP_STACK, GCC $GCC_MAJOR, C++$CXX_STANDARD"
          declare -p | grep -Ev 'BASHOPTS|BASH_VERSINFO|EUID|PPID|SHELLOPTS|UID' > /env.sh
          echo "export CXX_STANDARD=$CXX_STANDARD" >> /env.sh

      - name: Build
        run: |
          set -e
          source /env.sh
          cmake -S head -B build -G Ninja -DCMAKE_CXX_STANDARD=${CXX_STANDARD} \
                -DCMAKE_CXX_FLAGS="-Werror ${WARNING_FLAGS}"
          ninja -C build

      - name: Test
        run: |
          set -e
          source /env.sh
          ctest --test-dir build -j$(nproc) --output-on-failure

      - name: Compare with the base branch
        if: github.event_name == 'pull_request'
        env:
          CHANGES_OUTPUT: ${{ contains(github.event.pull_request.labels.*.name, 'changes-output') }}
        run: |
          source /env.sh
          base="${{ github.event.pull_request.base.ref }}"
          job="${{ matrix.build_type }}, ${{ matrix.image }}"
          echo "### Output compared with \`$base\` ($job)" > summary.md
          # The base branch is built without -Werror: it may predate the warning fixes.
          # compare_to_base.sh exits with 0 if the outputs are identical, 3 if they differ, and
          # with any other code if building, digitising or comparing failed.
          status=0
          { cmake -S base -B build_base -G Ninja -DCMAKE_CXX_STANDARD=${CXX_STANDARD} -DBUILD_TESTING=OFF > /dev/null &&
            ninja -C build_base > /dev/null &&
            bash head/test/compare_to_base.sh build_base/lib/libMuonCVXDDigitiser.so build/lib/libMuonCVXDDigitiser.so \
                 build/test/data/mu_gun_detailed.slcio compare summary.md; } || status=$?
          case "$status:$CHANGES_OUTPUT" in
            0:true)
              message="The output is identical to $base, but the PR has the changes-output label: remove it if the PR no longer changes the output."
              echo "::warning title=Output identical to $base::$message"
              exit_code=0 ;;
            0:*)
              message="The output is identical to $base."
              exit_code=0 ;;
            3:true)
              message="The output differs from $base, as declared by the changes-output label."
              echo "::notice title=Output differs from $base (expected)::$message"
              exit_code=0 ;;
            3:*)
              message="The output differs from $base. If this is intended, update the references and add the changes-output label."
              echo "::error title=Output differs from $base::$message"
              exit_code=1 ;;
            *)
              message="The comparison with $base failed (exit code $status) while building $base or digitising: see the log of this step."
              echo "::error title=Comparison with $base failed::$message"
              exit_code=1 ;;
          esac
          echo "$message"
          echo -e "\n**$message**" >> summary.md
          cat summary.md >> $GITHUB_STEP_SUMMARY
          exit $exit_code

      - name: Upload test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-outputs-${{ matrix.build_type }}-${{ matrix.image }}
          path: |
            build/test/out/*.csv
            build/test/out/*.log
            build/Testing/Temporary/LastTest.log
            compare/*.csv
            compare/*.log
            summary.md
          if-no-files-found: ignore
