name: Build and test

on:
  push:
    branches:
    - master
  pull_request:
    # labeled/unlabeled: re-run when the changes-output label is added or removed
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/muoncollidersoft/mucoll-sim-ubuntu24:v2.11

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # The image is about 24 GB once extracted
      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      - uses: actions/checkout@v4
        with:
          path: head

      - name: Check out the base branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Launch container
        run: docker run --name ci -d -v ${GITHUB_WORKSPACE}:/ws -w /ws --entrypoint tail ${IMAGE} -f /dev/null

      - name: Build and run the tests
        run: |
          docker exec ci bash -c 'source /opt/setup_mucoll.sh > /dev/null 2>&1; set -e
            cmake -S head -B build -DCMAKE_CXX_FLAGS="-fdiagnostics-color=always"
            cmake --build build -j$(nproc)
            ctest --test-dir build -j$(nproc) --output-on-failure'

      - name: Compare with the base branch
        if: github.event_name == 'pull_request'
        env:
          CHANGES_OUTPUT: ${{ contains(github.event.pull_request.labels.*.name, 'changes-output') }}
        run: |
          echo "### Output compared with \`${{ github.event.pull_request.base.ref }}\`" > summary.md
          status=0
          docker exec ci bash -c 'source /opt/setup_mucoll.sh > /dev/null 2>&1; set -e
            cmake -S base -B build_base -DBUILD_TESTING=OFF > /dev/null
            cmake --build build_base -j$(nproc) > /dev/null
            bash head/test/compare_to_base.sh build_base/lib/libMuonCVXDDigitiser.so build/lib/libMuonCVXDDigitiser.so \
                 build/test/data/mu_gun_detailed.slcio compare summary.md' || status=$?
          if [ "$status" != 0 ]; then
            if [ "$CHANGES_OUTPUT" = "true" ]; then
              echo -e "\nThe output differs from the base branch, as expected with the \`changes-output\` label." >> summary.md
              status=0
            else
              echo -e "\n**The output differs from the base branch.** If this is intended, update the references and add the \`changes-output\` label." >> summary.md
            fi
          fi
          cat summary.md >> $GITHUB_STEP_SUMMARY
          exit $status

      - name: Upload test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-outputs
          path: |
            build/test/out/*.csv
            build/test/out/*.log
            compare/*.csv
            summary.md
          if-no-files-found: ignore
